<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Ninad Chaudhari &amp; Jami Cotler">
  <title>Course Planner — Siena College CS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/planner.css" rel="stylesheet">
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────────────── -->
<div class="toolbar">
  <span class="brand">
    <img src="../images/siena-logo.png" alt="Siena">
    CS Course Planner
  </span>
  <div class="divider"></div>
  <button class="btn btn-sm btn-outline-light" id="btn-upload"   title="Load a saved plan">&#128194; Upload</button>
  <button class="btn btn-sm btn-outline-light" id="btn-download" title="Download this plan as JSON">&#128190; Download</button>
  <div class="divider"></div>
  <button class="btn btn-sm btn-outline-info" id="btn-add-course" title="Add a course to the catalog">+ Course</button>
  <button class="btn btn-sm btn-outline-info" id="btn-add-dep"    title="Add a prerequisite link">+ Dependency</button>
  <div class="divider"></div>
  <button class="btn btn-sm btn-outline-warning" id="btn-add-year" title="Add a year to the timeline">+ Year</button>
  <button class="btn btn-sm btn-outline-warning" id="btn-rem-year" title="Remove the last year">&minus; Year</button>
  <div class="divider"></div>
  <button class="btn btn-sm btn-outline-light" id="btn-arrow-mode"
          title="Cycle arrow display: Focus (hover a course) → All → Off">Arrows: Focus</button>

  <div class="ms-auto">
    <button class="btn btn-sm btn-outline-light" id="btn-toggle-panel"
            title="Show or hide the requirements panel">Requirements &raquo;</button>
  </div>
  <input type="file" id="file-upload" accept=".json" style="display:none">
</div>

<!-- ── App ──────────────────────────────────────────────────── -->
<div class="app-container" id="app-container">

  <!-- Course Bank -->
  <div class="course-bank">
    <div class="bank-header">
      <h6>Course Bank</h6>
      <input type="text" class="bank-search" id="bank-search" placeholder="Search courses…">
    </div>
    <div class="bank-list" id="bank-list"></div>
  </div>

  <!-- Timeline -->
  <div class="timeline-area">
    <div class="timeline-scroll" id="timeline-scroll"></div>
  </div>

  <!-- Requirements Panel -->
  <div class="req-panel">
    <div class="req-head">
      <select id="track-filter" title="Choose a track to see its requirements">
        <option value="">— No track selected —</option>
      </select>
      <div id="req-summary"></div>
    </div>
    <div class="req-body" id="req-body"></div>
    <div class="req-foot">
      <button class="btn btn-sm btn-primary w-100" id="btn-load-template" disabled>
        Load suggested 4-year plan
      </button>
    </div>
  </div>
</div>

<!-- ── Add Course Modal ──────────────────────────────────────── -->
<div class="modal fade" id="addCourseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add New Course</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="add-course-form">
          <div class="row g-2 mb-2">
            <div class="col-5">
              <label class="form-label">Course ID *</label>
              <input type="text" class="form-control form-control-sm" id="nc-id" placeholder="CSIS-420">
            </div>
            <div class="col-7">
              <label class="form-label">Course Name *</label>
              <input type="text" class="form-control form-control-sm" id="nc-name" placeholder="Advanced Topics">
            </div>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-4">
              <label class="form-label">Credits</label>
              <input type="number" class="form-control form-control-sm" id="nc-credits" value="3" min="1" max="6">
            </div>
            <div class="col-4">
              <label class="form-label">Offered</label>
              <select class="form-select form-select-sm" id="nc-semester">
                <option value="every">Every semester</option>
                <option value="both">Both (yearly)</option>
                <option value="fall">Fall only</option>
                <option value="spring">Spring only</option>
              </select>
            </div>
            <div class="col-4">
              <label class="form-label">Period</label>
              <select class="form-select form-select-sm" id="nc-period">
                <option value="1">Every year</option>
                <option value="2">Every 2 yrs</option>
              </select>
            </div>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label">Start Year <small class="text-muted">(2-yr only)</small></label>
              <input type="number" class="form-control form-control-sm" id="nc-startyear" placeholder="2024">
            </div>
            <div class="col-6">
              <label class="form-label">Category</label>
              <select class="form-select form-select-sm" id="nc-category">
                <option value="cs">Computer Science</option>
                <option value="math">Math / Auxiliary</option>
                <option value="core">Core (Gen-Ed)</option>
                <option value="free">Free Elective</option>
              </select>
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label">Tracks <small class="text-muted">(comma-separated: SD, AI, GD…)</small></label>
            <input type="text" class="form-control form-control-sm" id="nc-tracks" placeholder="SD, AI">
          </div>
          <div class="mb-1">
            <label class="form-label">Prerequisites <small class="text-muted">(comma-separated course IDs)</small></label>
            <input type="text" class="form-control form-control-sm" id="nc-prereqs" placeholder="CSIS-210, MATH-250">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-sm btn-primary" id="add-course-submit">Add Course</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Add Dependency Modal ──────────────────────────────────── -->
<div class="modal fade" id="addDepModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Prerequisite</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Prerequisite (FROM)</label>
        <select class="form-select form-select-sm mb-2" id="dep-from"></select>
        <div class="text-center mb-2" style="font-size:1.3rem">&darr;</div>
        <label class="form-label">Requires it (TO)</label>
        <select class="form-select form-select-sm mb-3" id="dep-to"></select>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="dep-alt">
          <label class="form-check-label" for="dep-alt" style="font-size:.75rem">
            Alternative route <small class="text-muted d-block">
            Dashed “either” arrow — one of several ways to satisfy the target.</small>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-sm btn-primary" id="add-dep-submit">Add</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Standing disclaimer ──────────────────────────────────── -->
<div class="disclaimer-bar">
  <span class="disclaimer-flag">Tool under test</span>
  <span>
    This planner is <b>not an official record</b>. Always verify your plan against
    <b>DegreeWorks</b> and confirm it with <b>your academic advisor</b> before registering.
    Course rotations are projections and may change.
  </span>
</div>

<div id="toast-container" class="toast-container position-fixed p-3"></div>

<!-- ── Scripts ──────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leader-line/leader-line.min.js"></script>
<script src="js/data.js"></script>
<script src="js/requirements.js"></script>
<script src="js/arrows.js"></script>
<script src="js/app.js"></script>
</body>
</html>
